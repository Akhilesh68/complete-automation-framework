[pytest]
markers =
    smoke: verifies that the basic functionality of the application or build works
    sanity: verifies that specific functionality works after a small change
    regression: verifies that existing functionality still works after code changes
    pending: test cases not yet executed

    login: tests related to login functionality
    logout: tests related to logout functionality
    positive: tests with valid inputs
    negative: tests with invalid inputs
    integration: tests interactions between modules
    functional: tests application functionality against requirements
    ui: tests related to user interface
    api: tests related to API functionality
    database: tests related to database functionality
    end_to_end: tests complete user workflows
    critical: tests for critical business functionality
    slow: tests that take a long time to execute
    skip_in_ci: tests that should not run in CI environments